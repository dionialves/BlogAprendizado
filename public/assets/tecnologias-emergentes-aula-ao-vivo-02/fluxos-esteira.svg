<svg xmlns="http://www.w3.org/2000/svg" width="560" height="1420" viewBox="0 0 560 1420" role="img" aria-labelledby="title desc"><title id="title">Duas trilhas, uma esteira compartilhada</title><desc id="desc">No caso didático de SaaS, a trilha de produto segue roadmap, épicas, implementação e release. A trilha de processos segue catálogo, priorização, correção ou ajuste e publicação. Ambas usam a esteira exemplificada: lint, build, testes unitários, testes de contrato, publicação de artefatos, deploy e verificação pós-deploy.</desc><style>text{font-family:system-ui,sans-serif;fill:#172b3c}.title{font-size:29px;font-weight:750}.head{font-size:27px;font-weight:700}.body{font-size:24px}.small{font-size:22px}.arrow{fill:none;stroke:#536e7c;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="560" height="1420" rx="20" fill="#f4f7fa"/><text x="28" y="51" class="title" text-anchor="start">Duas trilhas, uma base comum</text><text x="28" y="89" class="small" text-anchor="start">Caso didático de SaaS da aula 02</text><rect x="24" y="119" width="244" height="427" rx="15" fill="#e0eee4"/><text x="146" y="164" class="head" text-anchor="middle">Produto</text><rect x="34" y="188" width="224" height="57" rx="9" fill="#fff"/><text x="146" y="224" class="small" text-anchor="middle">Roadmap</text><path class="arrow" d="M146 250v17m-5-5 5 5 5-5"/><rect x="34" y="275" width="224" height="57" rx="9" fill="#fff"/><text x="146" y="311" class="small" text-anchor="middle">Épicas</text><path class="arrow" d="M146 337v17m-5-5 5 5 5-5"/><rect x="34" y="362" width="224" height="57" rx="9" fill="#fff"/><text x="146" y="398" class="small" text-anchor="middle">Implementação</text><path class="arrow" d="M146 424v17m-5-5 5 5 5-5"/><rect x="34" y="449" width="224" height="57" rx="9" fill="#fff"/><text x="146" y="485" class="small" text-anchor="middle">Release</text><rect x="292" y="119" width="244" height="427" rx="15" fill="#dceef8"/><text x="414" y="164" class="head" text-anchor="middle">Processos</text><rect x="302" y="188" width="224" height="57" rx="9" fill="#fff"/><text x="414" y="224" class="small" text-anchor="middle">Catálogo</text><path class="arrow" d="M414 250v17m-5-5 5 5 5-5"/><rect x="302" y="275" width="224" height="57" rx="9" fill="#fff"/><text x="414" y="311" class="small" text-anchor="middle">Priorização</text><path class="arrow" d="M414 337v17m-5-5 5 5 5-5"/><rect x="302" y="362" width="224" height="57" rx="9" fill="#fff"/><text x="414" y="398" class="small" text-anchor="middle">Correção / ajuste</text><path class="arrow" d="M414 424v17m-5-5 5 5 5-5"/><rect x="302" y="449" width="224" height="57" rx="9" fill="#fff"/><text x="414" y="485" class="small" text-anchor="middle">Publicação</text><path class="arrow" d="M146 551v24h268v-24M280 575v25m-6-6 6 6 6-6"/><text x="280" y="638" class="head" text-anchor="middle">Esteira compartilhada de CI/CD</text><text x="280" y="674" class="small" text-anchor="middle">Sequência exemplificada na aula</text><rect x="24" y="700" width="512" height="80" rx="12" fill="#e7edf3"/><text x="280" y="732" class="body" text-anchor="middle">1 · Lint</text><text x="280" y="763" class="small" text-anchor="middle">Análise básica do código</text><path class="arrow" d="M280 783v11m-4-4 4 4 4-4"/><rect x="24" y="798" width="512" height="80" rx="12" fill="#e7edf3"/><text x="280" y="830" class="body" text-anchor="middle">2 · Build</text><text x="280" y="861" class="small" text-anchor="middle">Construção do artefato</text><path class="arrow" d="M280 881v11m-4-4 4 4 4-4"/><rect x="24" y="896" width="512" height="80" rx="12" fill="#e7edf3"/><text x="280" y="928" class="body" text-anchor="middle">3 · Testes unitários</text><text x="280" y="959" class="small" text-anchor="middle">Partes isoladas</text><path class="arrow" d="M280 979v11m-4-4 4 4 4-4"/><rect x="24" y="994" width="512" height="80" rx="12" fill="#e7edf3"/><text x="280" y="1026" class="body" text-anchor="middle">4 · Testes de contrato</text><text x="280" y="1057" class="small" text-anchor="middle">Acordos de integração</text><path class="arrow" d="M280 1077v11m-4-4 4 4 4-4"/><rect x="24" y="1092" width="512" height="80" rx="12" fill="#e7edf3"/><text x="280" y="1124" class="body" text-anchor="middle">5 · Publicação de artefatos</text><text x="280" y="1155" class="small" text-anchor="middle">Disponibilização dos artefatos</text><path class="arrow" d="M280 1175v11m-4-4 4 4 4-4"/><rect x="24" y="1190" width="512" height="80" rx="12" fill="#e7edf3"/><text x="280" y="1222" class="body" text-anchor="middle">6 · Deploy</text><text x="280" y="1253" class="small" text-anchor="middle">Implantação no ambiente</text><path class="arrow" d="M280 1273v11m-4-4 4 4 4-4"/><rect x="24" y="1288" width="512" height="80" rx="12" fill="#e7edf3"/><text x="280" y="1320" class="body" text-anchor="middle">7 · Verificação pós-deploy</text><text x="280" y="1351" class="small" text-anchor="middle">Conferência após a implantação</text></svg>