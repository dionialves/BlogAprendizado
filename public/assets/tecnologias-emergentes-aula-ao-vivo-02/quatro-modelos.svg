<svg xmlns="http://www.w3.org/2000/svg" width="560" height="900" viewBox="0 0 560 900" role="img" aria-labelledby="title desc"><title id="title">Quatro modelos, quatro focos</title><desc id="desc">Processos enfatizam repetição e controle; produtos, evolução e valor; projetos, entregas delimitadas; programas, coordenação de iniciativas relacionadas. Os modelos podem coexistir e compartilhar suporte técnico.</desc><style>text{font-family:system-ui,sans-serif;fill:#183b36}.title{font-size:29px;font-weight:750}.head{font-size:27px;font-weight:700}.body{font-size:24px}.small{font-size:24px}.arrow{fill:none;stroke:#216453;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}</style><rect width="560" height="900" rx="20" fill="#faf9f5"/><text x="28" y="53" class="title" text-anchor="start">Quatro modelos, quatro focos</text><rect x="24" y="85" width="512" height="145" rx="15" fill="#edf3ef"/><text x="44" y="125" class="head" text-anchor="start">Processos</text><text x="44" y="164" class="body" text-anchor="start">Repetição e controle</text><text x="44" y="199" class="small" text-anchor="start">Padronizar o atendimento</text><rect x="24" y="250" width="512" height="145" rx="15" fill="#edf3ef"/><text x="44" y="290" class="head" text-anchor="start">Produtos</text><text x="44" y="329" class="body" text-anchor="start">Evolução e valor</text><text x="44" y="364" class="small" text-anchor="start">Manter a solução em evolução</text><rect x="24" y="415" width="512" height="145" rx="15" fill="#f7edda"/><text x="44" y="455" class="head" text-anchor="start">Projetos</text><text x="44" y="494" class="body" text-anchor="start">Entrega delimitada</text><text x="44" y="529" class="small" text-anchor="start">Definir escopo, prazo e marcos</text><rect x="24" y="580" width="512" height="145" rx="15" fill="#edf3ef"/><text x="44" y="620" class="head" text-anchor="start">Programas</text><text x="44" y="659" class="body" text-anchor="start">Coordenação estratégica</text><text x="44" y="694" class="small" text-anchor="start">Conectar iniciativas relacionadas</text><text x="280" y="786" class="body" text-anchor="middle">Os modelos podem coexistir.</text><text x="280" y="826" class="small" text-anchor="middle">Suporte técnico pode ser comum.</text><text x="280" y="866" class="small" text-anchor="middle"></text></svg>