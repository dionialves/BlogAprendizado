ass="small">Incertezas e respostas</text><rect x="362" y="583" width="296" height="95" rx="12" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><text x="510" y="622" text-anchor="middle" class="label">Aquisições</text><text x="510" y="656" text-anchor="middle" class="small">Contratos e entregas</text><rect x="130" y="730" width="420" height="100" rx="12" fill="#ffffff" stroke="#dce2da" stroke-width="2"/>
