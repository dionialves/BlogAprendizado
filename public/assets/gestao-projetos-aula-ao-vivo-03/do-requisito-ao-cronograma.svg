<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1010" viewBox="0 0 640 1010" role="img" aria-labelledby="title desc">
<title id="title">Do requisito ao cronograma</title><desc id="desc">Fluxo vertical: requisitos expressam necessidades; escopo define entregas, limites e critérios; EAP decompõe o escopo em pacotes; dos pacotes derivam atividades; o cronograma organiza duração, sequência e dependências.</desc>
<rect width="640" height="1010" rx="20" fill="#faf9f5"/>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#183b36}.label{font-size:30px;font-weight:600}.small{font-size:24px;fill:#66746e}.white{fill:#fff}</style>
<text x="320" y="48" text-anchor="middle" class="small">DO ENTENDIMENTO À ORGANIZAÇÃO DO TEMPO</text>
<rect x="30" y="82" width="580" height="120" rx="15" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><circle cx="78" cy="142" r="26" fill="#216453"/><text x="78" y="152" text-anchor="middle" class="label white">1</text><text x="345" y="129" text-anchor="middle" class="label">Requisitos</text><text x="345" y="167" text-anchor="middle" class="small">Necessidades a atender</text>
<path d="M320 200V235" fill="none" stroke="#216453" stroke-width="4"/><path d="M308 223L320 236L332 223" fill="none" stroke="#216453" stroke-width="4"/><rect x="30" y="248" width="580" height="120" rx="15" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><circle cx="78" cy="308" r="26" fill="#216453"/><text x="78" y="318" text-anchor="middle" class="label white">2</text><text x="345" y="295" text-anchor="middle" class="label">Escopo</text><text x="345" y="333" text-anchor="middle" class="small">Entregas, limites e critérios</text>
<path d="M320 366V401" fill="none" stroke="#216453" stroke-width="4"/><path d="M308 389L320 402L332 389" fill="none" stroke="#216453" stroke-width="4"/><rect x="30" y="414" width="580" height="120" rx="15" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><circle cx="78" cy="474" r="26" fill="#216453"/><text x="78" y="484" text-anchor="middle" class="label white">3</text><text x="345" y="461" text-anchor="middle" class="label">EAP e pacotes</text><text x="345" y="499" text-anchor="middle" class="small">Decomposição do escopo</text>
<path d="M320 532V567" fill="none" stroke="#216453" stroke-width="4"/><path d="M308 555L320 568L332 555" fill="none" stroke="#216453" stroke-width="4"/><rect x="30" y="580" width="580" height="120" rx="15" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><circle cx="78" cy="640" r="26" fill="#216453"/><text x="78" y="650" text-anchor="middle" class="label white">4</text><text x="345" y="627" text-anchor="middle" class="label">Atividades</text><text x="345" y="665" text-anchor="middle" class="small">Trabalho derivado dos pacotes</text>
<path d="M320 698V733" fill="none" stroke="#216453" stroke-width="4"/><path d="M308 721L320 734L332 721" fill="none" stroke="#216453" stroke-width="4"/><rect x="30" y="746" width="580" height="120" rx="15" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><circle cx="78" cy="806" r="26" fill="#216453"/><text x="78" y="816" text-anchor="middle" class="label white">5</text><text x="345" y="793" text-anchor="middle" class="label">Cronograma</text><text x="345" y="831" text-anchor="middle" class="small">Duração, sequência e dependências</text>
<rect x="70" y="902" width="500" height="4" fill="#e5b96c"/>
<text x="320" y="947" text-anchor="middle" class="small">Decompor o trabalho ajuda a planejar.</text>
<text x="320" y="981" text-anchor="middle" class="small">O cronograma organiza sua realização.</text></svg>