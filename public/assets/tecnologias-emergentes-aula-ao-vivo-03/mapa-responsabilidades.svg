<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1060" viewBox="0 0 1120 1060" role="img" aria-labelledby="title desc"><title id="title">Cinco camadas, cinco responsabilidades</title><desc id="desc">Mapa de responsabilidades e indicadores: controle, execução, gestão, integração e decisão.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#216453"/></marker></defs><rect width="1120" height="1060" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif" fill="#183b36"><text x="48" y="65" font-size="40" fill="#183b36" font-weight="bold">Onde localizar a responsabilidade?</text><text x="48" y="112" font-size="30" fill="#66746e" font-weight="normal">Observe a função e escolha a evidência.</text><rect x="48" y="145" width="1024" height="148" rx="12" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><rect x="48" y="145" width="8" height="148" rx="4" fill="#216453"/><text x="78" y="189" font-size="28" fill="#216453" font-weight="bold">01</text><text x="144" y="189" font-size="34" fill="#183b36" font-weight="bold">Dispositivos e controle</text><text x="144" y="233" font-size="30" fill="#183b36" font-weight="normal">Sensores, atuadores e CLP: processo físico.</text><text x="144" y="271" font-size="28" fill="#66746e" font-weight="normal">Observe: latência e perda de pacotes.</text><rect x="48" y="311" width="1024" height="148" rx="12" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><rect x="48" y="311" width="8" height="148" rx="4" fill="#216453"/><text x="78" y="355" font-size="28" fill="#216453" font-weight="bold">02</text><text x="144" y="355" font-size="34" fill="#183b36" font-weight="bold">Execução operacional</text><text x="144" y="399" font-size="30" fill="#183b36" font-weight="normal">SCADA supervisiona; MES acompanha ordens.</text><text x="144" y="437" font-size="28" fill="#66746e" font-weight="normal">Observe: taxa de confirmação das ordens.</text><rect x="48" y="477" width="1024" height="148" rx="12" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><rect x="48" y="477" width="8" height="148" rx="4" fill="#216453"/><text x="78" y="521" font-size="28" fill="#216453" font-weight="bold">03</text><text x="144" y="521" font-size="34" fill="#183b36" font-weight="bold">Gestão empresarial</text><text x="144" y="565" font-size="30" fill="#183b36" font-weight="normal">ERP: conciliar os registros do negócio.</text><text x="144" y="603" font-size="28" fill="#66746e" font-weight="normal">Observe: divergências e tempo de acerto.</text><rect x="48" y="643" width="1024" height="148" rx="12" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><rect x="48" y="643" width="8" height="148" rx="4" fill="#216453"/><text x="78" y="687" font-size="28" fill="#216453" font-weight="bold">04</text><text x="144" y="687" font-size="34" fill="#183b36" font-weight="bold">Nuvem e integração</text><text x="144" y="731" font-size="30" fill="#183b36" font-weight="normal">IIoT, APIs e eventos: conectar dados e serviços.</text><text x="144" y="769" font-size="28" fill="#66746e" font-weight="normal">Observe: latência, erros e filas.</text><rect x="48" y="809" width="1024" height="148" rx="12" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><rect x="48" y="809" width="8" height="148" rx="4" fill="#216453"/><text x="78" y="853" font-size="28" fill="#216453" font-weight="bold">05</text><text x="144" y="853" font-size="34" fill="#183b36" font-weight="bold">Apoio à decisão</text><text x="144" y="897" font-size="30" fill="#183b36" font-weight="normal">Análises e IA: apoiar decisões com dados válidos.</text><text x="144" y="935" font-size="28" fill="#66746e" font-weight="normal">Observe: completude e atualidade dos dados.</text><text x="48" y="1015" font-size="29" fill="#183b36" font-weight="normal">Camadas distribuem responsabilidades; não são etapas da entrega.</text></g></svg>