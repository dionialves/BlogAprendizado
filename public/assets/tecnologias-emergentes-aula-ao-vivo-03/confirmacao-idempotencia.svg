<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1130" viewBox="0 0 1120 1130" role="img" aria-labelledby="title desc"><title id="title">Repetir a operação sem duplicar o efeito</title><desc id="desc">Exemplo fictício: pedido com chave 12345 é processado, mas a confirmação se perde. A nova tentativa preserva a chave e retorna o resultado registrado, sem nova cobrança.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#216453"/></marker></defs><rect width="1120" height="1130" fill="#faf9f5"/><g font-family="Arial, Helvetica, sans-serif" fill="#183b36"><text x="48" y="65" font-size="40" fill="#183b36" font-weight="bold">Confirmação perdida, efeito preservado</text><text x="48" y="112" font-size="30" fill="#66746e" font-weight="normal">Exemplo didático fictício · chave da operação: 12345</text><rect x="48" y="148" width="450" height="68" rx="10" fill="#216453"/><text x="72" y="192" font-size="29" fill="#ffffff" font-weight="bold">CLIENTE</text><rect x="622" y="148" width="450" height="68" rx="10" fill="#216453"/><text x="646" y="192" font-size="29" fill="#ffffff" font-weight="bold">SERVIÇO DE PEDIDOS</text><rect x="48" y="260" width="450" height="130" rx="10" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><text x="70" y="298" font-size="29" fill="#183b36" font-weight="bold">1 · Enviar pedido</text><text x="70" y="334" font-size="29" fill="#183b36" font-weight="normal">Chave: 12345</text><rect x="622" y="260" width="450" height="130" rx="10" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><text x="644" y="298" font-size="29" fill="#183b36" font-weight="bold">2 · Processar pedido</text><text x="644" y="334" font-size="29" fill="#183b36" font-weight="normal">Aplicar efeito e registrar</text><text x="644" y="370" font-size="29" fill="#183b36" font-weight="normal">o resultado da operação.</text><path d="M 510 322 H 610" fill="none" stroke="#216453" stroke-width="3"  marker-end="url(#arrow)"/><text x="48" y="444" font-size="26" fill="#216453" font-weight="bold">PRIMEIRA TENTATIVA</text><rect x="622" y="472" width="450" height="130" rx="10" fill="#fff3dd" stroke="#e5b96c" stroke-width="2"/><text x="644" y="510" font-size="29" fill="#183b36" font-weight="bold">3 · Enviar confirmação</text><text x="644" y="546" font-size="29" fill="#183b36" font-weight="normal">A resposta se perde.</text><path d="M 610 535 H 510" fill="none" stroke="#216453" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="48" y="520" font-size="29" fill="#183b36" font-weight="normal">Sem confirmação, o cliente</text><text x="48" y="561" font-size="29" fill="#183b36" font-weight="normal">ainda não sabe o resultado.</text><path d="M 558 513 L 582 555 M 582 513 L 558 555" stroke="#183b36" stroke-width="4"/><text x="48" y="668" font-size="26" fill="#216453" font-weight="bold">NOVA TENTATIVA</text><rect x="48" y="696" width="450" height="130" rx="10" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><text x="70" y="734" font-size="29" fill="#183b36" font-weight="bold">4 · Reenviar pedido</text><text x="70" y="770" font-size="29" fill="#183b36" font-weight="normal">Preservar a mesma chave:</text><text x="70" y="806" font-size="29" fill="#183b36" font-weight="normal">12345.</text><rect x="622" y="696" width="450" height="130" rx="10" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><text x="644" y="734" font-size="29" fill="#183b36" font-weight="bold">5 · Consultar o registro</text><text x="644" y="770" font-size="29" fill="#183b36" font-weight="normal">Chave já processada:</text><text x="644" y="806" font-size="29" fill="#183b36" font-weight="normal">recuperar o resultado.</text><path d="M 510 758 H 610" fill="none" stroke="#216453" stroke-width="3"  marker-end="url(#arrow)"/><rect x="622" y="890" width="450" height="130" rx="10" fill="#ffffff" stroke="#dce2da" stroke-width="2"/><text x="644" y="928" font-size="29" fill="#183b36" font-weight="bold">6 · Retornar resultado</text><text x="644" y="964" font-size="29" fill="#183b36" font-weight="normal">Sem nova cobrança.</text><path d="M 610 952 H 510" fill="none" stroke="#216453" stroke-width="3"  marker-end="url(#arrow)"/><text x="48" y="943" font-size="29" fill="#183b36" font-weight="normal">Cliente recebe o resultado</text><text x="48" y="984" font-size="29" fill="#183b36" font-weight="normal">da operação já registrada.</text><text x="48" y="1080" font-size="30" fill="#183b36" font-weight="bold">Falta de resposta não prova que a operação deixou de ocorrer.</text></g></svg>